<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Prototipo del criptex — Ciudad Arcoíris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  html, body { height: 100%; margin: 0; background: #2A2150; overflow: hidden; font: 700 14px/1.3 Nunito, system-ui, sans-serif; color: #26315C;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  #c { display: block; width: 100%; height: 100%; }
  /* la ventana del código: sobria, semitransparente, arriba; cada palabra sobre su anillo del criptex */
  #codigo { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    background: rgba(28, 18, 62, .46); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 2px solid rgba(255, 255, 255, .28); border-radius: 22px; padding: 8px 0 12px; color: #fff; text-align: center;
    box-shadow: 0 8px 30px rgba(20, 10, 50, .25); pointer-events: none; }
  #codigo .titulo { font: 800 12px/1 Nunito, sans-serif; letter-spacing: .28em; opacity: .75; margin-bottom: 6px; }
  #codigo .palabras { display: flex; }
  #codigo .palabra { flex: 1; font: 800 38px/1.05 Nunito, sans-serif; letter-spacing: .02em; padding: 0 6px; white-space: nowrap;
    text-shadow: 0 2px 8px rgba(120, 80, 255, .55); transition: color .2s; }
  #codigo .palabra.mal { color: #FF9AA8; }
  #codigo .palabra.bien { color: #9BFFC8; }
  #codigo .sil { opacity: .55; font-weight: 700; }
  #codigo .msg { font: 800 20px/1.2 "Baloo 2", sans-serif; margin-top: 6px; min-height: 0; }
  #codigo .msg:empty { display: none; }
  /* el tiempo, debajo del código: un sector de círculo (lo que queda) que se achica, con el número al centro;
     semitransparente, y parpadea los últimos 5 segundos */
  #tiempo { position: absolute; left: 50%; top: calc(100% + 10px); transform: translateX(-50%); width: 86px; height: 86px;
    border-radius: 50%; background: rgba(28, 18, 62, .38); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    border: 2px solid rgba(255, 255, 255, .28); box-sizing: border-box; }
  #tiempo .sector { position: absolute; inset: 5px; border-radius: 50%;
    background: conic-gradient(rgba(255, 255, 255, .5) calc(var(--p, 1) * 360deg), transparent 0); }
  #tiempo b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 34px/1 Nunito, sans-serif; color: #fff;
    text-shadow: 0 2px 6px rgba(40, 20, 90, .7); }
  #tiempo.apurado .sector { background: conic-gradient(rgba(255, 170, 90, .75) calc(var(--p, 1) * 360deg), transparent 0); }
  #tiempo.apurado { animation: parpadeo .5s steps(1, end) infinite; }
  @keyframes parpadeo { 50% { opacity: .25; } }
  /* controles del prototipo (no son del juego) */
  #panel { position: fixed; left: 10px; bottom: 10px; background: rgba(255, 253, 248, .92); border-radius: 14px; padding: 8px 10px;
    box-shadow: 0 6px 20px rgba(38, 49, 92, .2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;
    max-width: 280px; z-index: 3; }
  #panel select, #panel button { font: inherit; }
  #panel[hidden] { display: none; }
  #abrir { position: fixed; left: 10px; bottom: 10px; z-index: 3; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="codigo">
  <div class="titulo">CÓDIGO AURA</div>
  <div class="palabras"><span class="palabra"></span><span class="palabra"></span><span class="palabra"></span></div>
  <div class="msg"></div>
  <div id="tiempo"><div class="sector"></div><b></b></div>
</div>
<button id="abrir" hidden>⚙</button>
<div id="panel">
  <label>Cámara <select id="toma"><option value="abajo">desde abajo</option><option value="cerca">de frente</option><option value="orbita">girando</option></select></label>
  <label>Figuras <select id="figuras"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></label>
  <label><input id="silabas" type="checkbox"> sílabas</label>
  <button id="nuevo">Nuevo código</button>
  <button id="cerrar" title="Ocultar">✕</button>
</div>
<script type="module" src="./criptex.js"></script>
</body>
</html>
