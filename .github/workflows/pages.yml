# Publica la versión web del juego (dist/web) en GitHub Pages cada vez que se sube algo a main.
# Requisito (una sola vez): en GitHub → Settings → Pages → Source: "GitHub Actions".
# Las pruebas no corren aquí: las capturas de referencia dependen de la GPU del PC donde se tomaron.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web
      - id: deploy
        uses: actions/deploy-pages@v4
