<meta charset="utf-8">
<title>Ciudad Arcoíris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root{
    --ink:#26315C; --ink-soft:#6B7199; --paper:#FFFDF8; --line:#EFE8F1;
    --pink:#FF6FAE; --pink-d:#D94E8C; --sun:#FFC93C; --sun-d:#DDA21A;
    --mint:#34CFA0; --mint-d:#1FA67E; --sky:#55B6F5; --sky-d:#3690CE;
    --coral:#FF7A59; --coral-d:#D95A3B;
    --display:"Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --body:"Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  [hidden]{display:none!important;}
  html,body{height:100%;}
  body{margin:0;background:#9FD8FF;color:var(--ink);font-family:var(--body);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;}
  #game{position:fixed;inset:0;overflow:hidden;}
  #c{display:block;width:100%;height:100%;touch-action:none;}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  button:focus-visible{outline:4px solid var(--sky);outline-offset:3px;}

  /* ---------- toy buttons ---------- */
  .toy{--bg:#fff;--bd:#D9D3E6;--fg:var(--ink);
    font:800 18px/1 var(--display);color:var(--fg);background:var(--bg);border:3px solid rgba(255,255,255,.9);
    border-radius:999px;padding:12px 20px 10px;box-shadow:0 5px 0 var(--bd),0 10px 22px rgba(38,49,92,.18);
    transition:transform .08s ease, box-shadow .08s ease;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;}
  .toy:active{transform:translateY(4px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(38,49,92,.18);}
  .toy.pink{--bg:var(--pink);--bd:var(--pink-d);--fg:#fff;}
  .toy.sun{--bg:var(--sun);--bd:var(--sun-d);--fg:var(--ink);}
  .toy.mint{--bg:var(--mint);--bd:var(--mint-d);--fg:#fff;}
  .toy.sky{--bg:var(--sky);--bd:var(--sky-d);--fg:#fff;}
  .toy.coral{--bg:var(--coral);--bd:var(--coral-d);--fg:#fff;}
  .toy .em{font-size:22px;line-height:1;}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;}
  #hud > *{pointer-events:auto;}
  #place{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));
    font:800 17px/1 var(--display);background:rgba(255,253,248,.92);padding:10px 16px 8px;border-radius:999px;
    border:3px solid #fff;box-shadow:0 4px 0 rgba(38,49,92,.12);display:flex;align-items:center;gap:8px;pointer-events:none;}
  #place .dot{width:12px;height:12px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 3px #FFD6E8;}
  #topright{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));display:flex;gap:10px;}
  .round{width:58px;height:58px;padding:0;border-radius:50%;font-size:26px;}
  .round.off{--bg:#E8E4EE;--bd:#C9C2D6;}

  #joy{position:absolute;left:calc(30px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));
    width:156px;height:156px;border-radius:50%;background:rgba(255,255,255,.32);border:4px solid rgba(255,255,255,.9);
    box-shadow:0 6px 0 rgba(38,49,92,.14), inset 0 0 0 10px rgba(255,255,255,.18);touch-action:none;}
  #joy::before{content:"";position:absolute;inset:34px;border-radius:50%;border:3px dashed rgba(255,255,255,.7);}
  #joyKnob{position:absolute;left:50%;top:50%;width:70px;height:70px;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%,#fff 0 18%,#FF9CC7 19% 100%);border:4px solid #fff;
    box-shadow:0 5px 0 var(--pink-d),0 10px 20px rgba(38,49,92,.25);pointer-events:none;}
  #joyHint{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font:800 14px/1 var(--display);color:#fff;
    text-shadow:0 2px 0 rgba(38,49,92,.35);white-space:nowrap;pointer-events:none;}

  #actions{position:absolute;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
    display:flex;flex-direction:column;align-items:flex-end;gap:14px;}
  #actionRow{display:flex;align-items:flex-end;gap:14px;}
  #menuBtns{display:flex;flex-direction:column;gap:12px;align-items:stretch;position:relative;}
  #actMenu{position:absolute;right:calc(100% + 12px);bottom:0;display:grid;grid-template-columns:repeat(2,auto);gap:8px;
    background:var(--paper);border:4px solid #fff;border-radius:26px;padding:12px;box-shadow:0 8px 0 rgba(38,49,92,.12),0 18px 44px rgba(38,49,92,.26);
    animation:pop .22s cubic-bezier(.2,1.4,.4,1);transform-origin:right bottom;}
  #actMenu h4{grid-column:1/-1;margin:2px 4px 2px;font:800 13px/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);}
  @keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
  .act{display:flex;align-items:center;gap:8px;border:3px solid var(--line);background:#fff;border-radius:16px;padding:9px 12px 8px;
    font:800 16px/1 var(--display);color:var(--ink);box-shadow:0 3px 0 var(--line);white-space:nowrap;text-align:left;}
  .act .em{font-size:22px;line-height:1;}
  .act.on{border-color:var(--pink);background:#FFF0F7;box-shadow:0 3px 0 #FFB8D6;}
  .act:active{transform:translateY(2px);}
  #btnAct[aria-expanded="true"]{transform:translateY(4px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(38,49,92,.18);}
  #btnJump{width:104px;height:104px;border-radius:50%;flex-direction:column;gap:2px;font-size:17px;padding:0;}
  #btnJump .em{font-size:34px;}
  #btnAction{font-size:21px;padding:16px 24px 13px;animation:bob 1.2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  #btnAction:active{animation:none;}

  #toast{position:absolute;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);
    font:800 19px/1.1 var(--display);background:var(--paper);border:4px solid #fff;padding:12px 22px 10px;border-radius:999px;
    box-shadow:0 5px 0 rgba(38,49,92,.14),0 12px 30px rgba(38,49,92,.2);transition:transform .35s cubic-bezier(.2,1.4,.4,1);
    pointer-events:none;max-width:calc(100% - 32px);text-align:center;white-space:normal;}
  #toast.show{transform:translate(-50%,0);}

  #game.menu #joy,#game.menu #actions,#game.menu #place{display:none;}
  #driveBtns{display:none;align-items:flex-end;gap:14px;}
  #driveCol{display:flex;flex-direction:column;gap:12px;align-items:stretch;}
  #game.driving #driveBtns{display:flex;}
  #game.driving #actionRow,#game.driving #btnAction{display:none;}
  #btnBrake{width:104px;height:104px;border-radius:50%;flex-direction:column;gap:2px;font-size:17px;padding:0;}
  #btnBrake .em{font-size:32px;}
  #btnBrake.held{transform:translateY(4px);box-shadow:0 1px 0 var(--bd),0 4px 10px rgba(38,49,92,.18);}
  .opt svg{display:block;width:56px;height:28px;}
  #game.intro #hud{display:none;}

  /* ---------- panels ---------- */
  .panel{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));
    bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(430px,44vw);background:var(--paper);border-radius:30px;
    border:4px solid #fff;box-shadow:0 10px 0 rgba(38,49,92,.12),0 24px 60px rgba(38,49,92,.28);display:flex;flex-direction:column;
    overflow:hidden;animation:slideIn .4s cubic-bezier(.2,1.25,.4,1);}
  @keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  .phead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 14px 22px;color:#fff;}
  #petPanel .phead{background:var(--mint);}
  .phead h2{margin:0;font:800 30px/1 var(--display);letter-spacing:.01em;text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.12);padding-top:4px;}
  .phead .toy{font-size:17px;padding:10px 18px 8px;}
  .tabs{display:flex;gap:8px;padding:14px 16px 10px;overflow-x:auto;flex:none;touch-action:pan-x;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  #shopPanel .phead{background:var(--sky);}
  #shopPanel .opt.on{border-color:var(--sky);background:#EAF6FF;box-shadow:0 3px 0 #A9DBFB;}
  .opts.nums{grid-template-columns:repeat(auto-fill,minmax(54px,1fr));}
  .opts.nums .opt{min-height:52px;font:800 21px/1 var(--display);}
  .cdot{flex:none;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #D9D3E6;}
  .garage .mypet{flex-wrap:wrap;row-gap:8px;}
  .mypet.on{border-color:var(--sky);background:#EAF6FF;}
  .toy.wide{width:100%;margin-top:14px;}
  .pbody p.note.editing{background:#EAF6FF;border-radius:14px;padding:10px 12px;color:var(--ink);margin-top:12px;}
  .tab{flex:none;border:0;background:#F4EEF6;color:var(--ink);font:800 17px/1 var(--display);padding:11px 16px 9px;border-radius:999px;}
  .tab.on{background:var(--ink);color:#fff;}
  .pbody{flex:1;overflow-y:auto;padding:4px 18px 18px;touch-action:pan-y;-webkit-overflow-scrolling:touch;}
  .pbody h3{margin:16px 0 10px;font:800 13px/1 var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);}
  .pbody p.note{margin:6px 0 0;font:700 14px/1.4 var(--body);color:var(--ink-soft);}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;}
  .opt{border:3px solid var(--line);background:#fff;border-radius:18px;min-height:74px;padding:8px 6px 6px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;font:700 14px/1.1 var(--body);color:var(--ink);box-shadow:0 3px 0 var(--line);text-align:center;}
  .opt .ic{font-size:26px;line-height:1;}
  .opt.on{border-color:var(--pink);background:#FFF0F7;box-shadow:0 3px 0 #FFB8D6;}
  #petPanel .opt.on{border-color:var(--mint);background:#EAFBF4;box-shadow:0 3px 0 #9DE8CF;}
  .opt:active{transform:translateY(2px);}
  .sws{display:flex;flex-wrap:wrap;gap:10px;}
  .sw{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #E2DAEA,0 3px 0 rgba(38,49,92,.12);padding:0;}
  .sw.on{box-shadow:0 0 0 4px var(--ink),0 3px 0 rgba(38,49,92,.12);transform:scale(1.06);}
  .pfoot{flex:none;display:flex;gap:10px;padding:12px 16px 16px;border-top:3px solid var(--line);background:#fff;}
  .pfoot .toy{flex:1;}
  #petName{width:100%;box-sizing:border-box;font:700 19px/1 var(--body);color:var(--ink);padding:14px 16px;border-radius:16px;border:3px solid var(--line);
    background:#fff;-webkit-user-select:text;user-select:text;touch-action:manipulation;}
  #petName:focus{outline:none;border-color:var(--mint);}
  .mypets{display:flex;flex-direction:column;gap:8px;}
  .mypet{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 8px 8px 12px;}
  .mypet .ic{font-size:28px;}
  .mypet b{flex:1;font:800 18px/1 var(--display);padding-top:3px;}
  .mypet .toy{font-size:14px;padding:9px 14px 7px;}
  .empty{font:700 15px/1.4 var(--body);color:var(--ink-soft);margin:0;}

  /* ---------- start screen ---------- */
  #start{position:absolute;inset:0;display:grid;place-items:center;padding:16px;
    background:radial-gradient(ellipse at 50% 60%,rgba(255,255,255,.15),rgba(80,150,220,.25));}
  .card{width:min(540px,100%);box-sizing:border-box;background:rgba(255,253,248,.94);border:5px solid #fff;border-radius:40px;
    padding:30px 32px 28px;text-align:center;box-shadow:0 12px 0 rgba(38,49,92,.12),0 30px 80px rgba(38,49,92,.3);}
  .card h1{margin:0;font:800 clamp(44px,8vw,68px)/.95 var(--display);letter-spacing:-.01em;text-wrap:balance;
    background:linear-gradient(90deg,#FF5E7E,#FF9B4A 22%,#F5C518 40%,#3CC96A 58%,#3FA7F0 76%,#9B6BF0);
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(38,49,92,.16));padding-top:8px;}
  .card .sub{margin:10px auto 22px;max-width:36ch;font:700 18px/1.45 var(--body);color:var(--ink);}
  .card .toy{font-size:26px;padding:18px 40px 15px;}
  .how{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin:22px 0 0;padding:0;list-style:none;font:700 14px/1.3 var(--body);color:var(--ink-soft);}
  .how li{display:flex;align-items:center;gap:6px;}
  .how b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#F4EEF6;font-size:14px;}

  @media (max-width:760px), (orientation:portrait) and (max-width:1000px){
    .panel{left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));top:auto;
      bottom:calc(10px + env(safe-area-inset-bottom,0px));width:auto;height:min(58%,560px);border-radius:26px;}
    .phead h2{font-size:26px;}
    @keyframes slideIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  }
  @media (max-width:560px){
    #joy{width:130px;height:130px;left:18px;bottom:22px;}
    #joy::before{inset:28px;}
    #joyKnob{width:58px;height:58px;}
    #btnJump{width:86px;height:86px;}
    #btnBrake{width:86px;height:86px;}
    #actions{right:14px;bottom:20px;gap:10px;}
    #menuBtns{gap:9px;}
    #actMenu{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:10px;border-radius:22px;z-index:5;transform-origin:center bottom;}
    .act{font-size:14px;padding:7px 8px 6px;min-width:0;white-space:normal;line-height:1.1;} .act .em{font-size:18px;flex:none;}
    .toy{font-size:15px;padding:10px 14px 8px;}
    #place{font-size:14px;}
  }
  @media (prefers-reduced-motion:reduce){
    #btnAction{animation:none;} .panel{animation:none;} #toast{transition:none;}
  }
</style>

<div id="game" class="intro">
  <canvas id="c" aria-label="Ciudad en 3D"></canvas>

  <div id="hud">
    <div id="place"><span class="dot"></span><span id="placeName">Calle Arcoíris</span></div>
    <div id="topright">
      <button id="btnMusic" class="toy round" aria-label="Música">🎵</button>
    </div>
    <div id="joy" aria-label="Mover"><span id="joyHint">¡Mueve aquí!</span><div id="joyKnob"></div></div>
    <div id="actions">
      <button id="btnAction" class="toy sun" hidden></button>
      <div id="actionRow">
        <div id="menuBtns">
          <button id="btnAct" class="toy pink" aria-haspopup="true" aria-expanded="false" aria-controls="actMenu"><span class="em">🎬</span>Acción</button>
          <div id="actMenu" role="menu" hidden></div>
          <button id="btnPets" class="toy mint"><span class="em">🐾</span>Mascotas</button>
          <button id="btnMyCar" class="toy coral"><span class="em">🚗</span>Mi auto</button>
          <button id="btnWave" class="toy"><span class="em">👋</span>Saludar</button>
        </div>
        <button id="btnJump" class="toy sky"><span class="em">⬆</span>Saltar</button>
      </div>
      <div id="driveBtns">
        <div id="driveCol">
          <button id="btnHorn" class="toy sun"><span class="em">📯</span>Bocina</button>
          <button id="btnExit" class="toy"><span class="em">🚪</span>Bajarse</button>
        </div>
        <button id="btnBrake" class="toy coral"><span class="em">✋</span>Frenar</button>
      </div>
    </div>
    <div id="toast" role="status"></div>
  </div>

  <aside id="petPanel" class="panel" hidden>
    <div class="phead"><h2>Refugio de Mascotas</h2><button id="petDone" class="toy">Listo</button></div>
    <div id="petBody" class="pbody"></div>
    <div class="pfoot">
      <button id="btnAdopt" class="toy mint"><span class="em">💚</span>Adoptar</button>
    </div>
  </aside>

  <aside id="shopPanel" class="panel" hidden>
    <div class="phead"><h2>Autos Arcoíris</h2><button id="shopDone" class="toy">Salir</button></div>
    <div id="shopTabs" class="tabs"></div>
    <div id="shopBody" class="pbody"></div>
    <div class="pfoot">
      <button id="btnCarRandom" class="toy sun"><span class="em">✨</span>Sorpréndeme</button>
      <button id="btnBuy" class="toy sky"><span class="em">🔑</span>¡Lo quiero!</button>
    </div>
  </aside>

  <div id="start">
    <div class="card">
      <h1>Ciudad Arcoíris</h1>
      <p class="sub">Pasea por la ciudad con Nina, baila, adopta mascotas y diseña tu propio auto.</p>
      <button id="btnPlay" class="toy pink" disabled>Construyendo la ciudad…</button>
      <ul class="how">
        <li><b>🕹</b>Círculo: caminar</li>
        <li><b>👆</b>Arrastra: girar la cámara</li>
        <li><b>🤏</b>Pellizca: acercar</li>
      </ul>
    </div>
  </div>
</div>

/* rounded box with analytic normals — the soft "toy" look */
function rbox(w, h, d, r, seg = 6) {
  r = Math.min(r, w / 2, h / 2, d / 2) * 0.999;
  return G(`rb${w},${h},${d},${r},${seg}`, () => {
    const g = new THREE.BoxGeometry(1, 1, 1, seg, seg, seg);
    const p = g.attributes.position, n = g.attributes.normal;
    const half = [w / 2, h / 2, d / 2];
    const v = new THREE.Vector3();
    const c = [0, 0, 0], out = [0, 0, 0], inner = [0, 0, 0];
    for (let i = 0; i < p.count; i++) {
      c[0] = p.getX(i); c[1] = p.getY(i); c[2] = p.getZ(i);
      for (let a = 0; a < 3; a++) {
        const idx = Math.round((c[a] + 0.5) * seg), H = half[a];
        const map = seg === 6 ? [-H, -H + r / 2, -H + r, 0, H - r, H - r / 2, H] : [-H, -H + r, 0, H - r, H];
        out[a] = map[idx];
        inner[a] = clamp(out[a], -(H - r), H - r);
      }
      v.set(out[0] - inner[0], out[1] - inner[1], out[2] - inner[2]);
      if (v.lengthSq() > 1e-10) v.normalize(); else v.set(0, 1, 0);
      p.setXYZ(i, inner[0] + v.x * r, inner[1] + v.y * r, inner[2] + v.z * r);
      n.setXYZ(i, v.x, v.y, v.z);
    }
    return g;
  });
}
const rlo = (w, h, d, r) => rbox(w, h, d, r, 4);

function mesh(geo, m, x = 0, y = 0, z = 0, cast = true, recv = true) {

/* merge static meshes by material -> few draw calls */
function mergeInto(root, meshes, useLocal) {
  const buckets = new Map();
  for (const o of meshes) {
    let b = buckets.get(o.material);
    if (!b) { b = { geos: [], cast: false }; buckets.set(o.material, b); }
    const g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    g.applyMatrix4(useLocal ? o.matrix : o.matrixWorld);
    b.geos.push(g); b.cast = b.cast || o.castShadow;
    o.parent.remove(o);
  }
  const made = [];
  buckets.forEach((b, m) => {
    let n = 0; b.geos.forEach(g => n += g.attributes.position.count);
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3);
    let off = 0;
    b.geos.forEach(g => { pos.set(g.attributes.position.array, off * 3); nor.set(g.attributes.normal.array, off * 3); off += g.attributes.position.count; g.dispose(); });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    geo.computeBoundingSphere();
    const mm = new THREE.Mesh(geo, m); mm.castShadow = b.cast; mm.receiveShadow = true;
    root.add(mm); made.push(mm);
  });
  return made;
}
function mergeStatic(root) {
  root.updateMatrixWorld(true);
  const list = [];
  (function walk(o) {
    if (o.userData.dynamic) return;
    if (o.isMesh && !o.isInstancedMesh && !o.material.map && !o.material.transparent) list.push(o);
    o.children.forEach(walk);
  })(root);
  mergeInto(root, list, false);
}
function mergeChildren(group) {
  const list = group.children.filter(o => o.isMesh && !o.material.transparent && !o.material.map);
  list.forEach(o => o.updateMatrix());
  return mergeInto(group, list, true);
}

/* canvas text textures */
function roundRect(x, X, y, w, h, r) { x.beginPath(); x.moveTo(X + r, y); x.arcTo(X + w, y, X + w, y + h, r); x.arcTo(X + w, y + h, X, y + h, r); x.arcTo(X, y + h, X, y, r); x.arcTo(X, y, X + w, y, r); x.closePath(); }

  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  roundRect(x, 8, 8, w - 16, h - 16, 60); x.fillStyle = '#FFFFFF'; x.fill();
  roundRect(x, 22, 22, w - 44, h - 44, 48); x.fillStyle = bg; x.fill();
  x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle';
  let size = 120; x.font = `800 ${size}px "Baloo 2", "Trebuchet MS", sans-serif`;
  while (x.measureText(text).width > w - 110 && size > 40) { size -= 4; x.font = `800 ${size}px "Baloo 2", "Trebuchet MS", sans-serif`; }
  x.fillText(text, w / 2, h / 2 + size * 0.08);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function makeSign(text, bg, fg, width) {
  const tex = signTexture(text, bg, fg);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(width, width * 220 / 1024), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, transparent: true }));
  return m;
}
const labelCache = new Map();
function labelSprite(text, opts = {}) {

    const c = document.createElement('canvas'); const x = c.getContext('2d');
    const font = `800 56px "Baloo 2", "Trebuchet MS", sans-serif`; x.font = font;
    const tw = Math.ceil(x.measureText(text).width);
    c.width = tw + 70; c.height = opts.bubble ? 120 : 96;
    x.font = font;
    const h = 90;

    if (opts.bubble) { x.lineWidth = 6; x.strokeStyle = '#26315C'; x.stroke(); x.beginPath(); x.moveTo(c.width / 2 - 14, h - 6); x.lineTo(c.width / 2, h + 22); x.lineTo(c.width / 2 + 14, h - 6); x.fillStyle = '#FFFFFF'; x.fill(); }

}

function buildSky() {

    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(0x3E9CF0) }, mid: { value: new THREE.Color(0xA9DDFF) }, bot: { value: new THREE.Color(0xDDF3FF) } },
    vertexShader: 'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader: 'uniform vec3 top,mid,bot;varying vec3 vP;void main(){float h=vP.y;vec3 c=h>0.?mix(mid,top,smoothstep(0.,.55,h)):mix(mid,bot,smoothstep(0.,-.25,h));gl_FragColor=vec4(c,1.);}'
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(400, 32, 16), skyMat);
  sky.renderOrder = -10;
  // sun glow
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const gr = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,255,240,1)'); gr.addColorStop(0.22, 'rgba(255,248,210,1)'); gr.addColorStop(0.35, 'rgba(255,236,170,.55)'); gr.addColorStop(1, 'rgba(255,230,160,0)');

  sunSpr.scale.set(90, 90, 1); sunSpr.position.copy(SUN_OFF).normalize().multiplyScalar(360);

}

function buildClouds() {

  const clouds = [];

function buildGround() {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(460, 460), new THREE.MeshStandardMaterial({ map: grassTexture(), roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

  const roadM = mat('#606B85', { roughness: 0.95 }), walkM = mat('#F1E9DD', { roughness: 0.9 }), dashM = mat('#FFD466', { roughness: 0.8 }), whiteM = mat('#FFFFFF', { roughness: 0.8 });

    world.add(mesh(box(ROAD_HALF * 2, 0.05, EXT * 2), roadM, L, 0.03 + i * 0.001, 0, false, true));
  });

  LINES.forEach(L => segs.forEach(([a, b]) => [-1, 1].forEach(s => {

    world.add(mesh(rlo(2, 0.18, 2, 0.06), walkM, Lx + sx * WALK, 0.09, Lz + sz * WALK, false, true));

  // centre dashes

      world.add(mesh(box(1.8, 0.02, 0.22), dashM, p, 0.07, L, false, true));
      world.add(mesh(box(0.22, 0.02, 1.8), dashM, L, 0.075, p, false, true));
    }

    for (let k = -2; k <= 2; k++) {
      world.add(mesh(box(1.5, 0.02, 0.62), whiteM, Lx + s * WALK, 0.08, Lz + k * 1.3, false, true));

  LINES.forEach(L => [-EXT + 8, -24, -16, 16, 24, EXT - 8].forEach(p => {

      addObs(x, z, 0.25, 0.25);

  }));
  // distant hills
  const hr = seeded(3);

  for (let i = 0; i < 22; i++) {
    const a = i / 22 * TAU + hr() * 0.2, d = 130 + hr() * 40, r = 24 + hr() * 22;
    const h = new THREE.Mesh(sph(1, 24, 14), hillM[i % 3]); h.scale.set(r * 1.4, r * 0.55, r);

    scene.add(h);
  }
}

function buildCity() {
  buildGround();

  park(-20, -20);

  const mine = house(-13, 26, Math.PI / 2, { w: 9, d: 7.5, h: 6, wall: '#FFD6E2', roof: '#FF6FAE', door: '#9B6BF0', path: 3.3 });
  const s = makeSign('Mi Casa', '#9B6BF0', '#FFFFFF', 3.4); s.position.set(0, 5.1, 7.5 / 2 + 0.07); mine.add(s);
  flowers(-7.5, 20, 2, 4, 14, 41); flowers(-7.5, 32, 2, 4, 14, 42);
  carShop();

  // houses in the outer blocks, each facing the nearest street
  const outer = [-57.75, -20, 20, 57.75];
  let k = 0;
  outer.forEach(bx => outer.forEach(bz => {
    if (Math.abs(bx) < 30 && Math.abs(bz) < 30) return;
    if (bx > 50 && bz === -20) { k++; return; } // this block is the car dealership
    let best = null;
    LINES.forEach(L => {
      const dx = Math.abs(bx - L), dz = Math.abs(bz - L);
      if (!best || dx < best.d) best = { d: dx, axis: 'x', dir: Math.sign(L - bx) };
      if (dz < best.d) best = { d: dz, axis: 'z', dir: Math.sign(L - bz) };
    });
    const ry = best.axis === 'x' ? (best.dir > 0 ? Math.PI / 2 : -Math.PI / 2) : (best.dir > 0 ? 0 : Math.PI);
    const st = HOUSE_STYLES[k % HOUSE_STYLES.length];
    const big = k % 3 === 1;
    const d = 7.5, towardStreet = best.d - 5.5; // distance from block center to sidewalk
    const back = towardStreet - d / 2 - 6;       // front yard of 6
    const hx = best.axis === 'x' ? bx + best.dir * back : bx;
    const hz = best.axis === 'z' ? bz + best.dir * back : bz;
    house(hx, hz, ry, Object.assign({ w: big ? 10 : 8.5, d, h: big ? 6.2 : 4.4, path: 5.2 }, st));
    // side trees & yard hedges
    const sideX = best.axis === 'x' ? 0 : 1, sideZ = 1 - sideX;
    [-1, 1].forEach(s => tree(hx + sideX * s * 8.5 + (best.axis === 'x' ? -best.dir * 3 : 0), hz + sideZ * s * 8.5 + (best.axis === 'z' ? -best.dir * 3 : 0), 0.95 + (k % 3) * 0.1, (k + (s > 0 ? 1 : 0)) % 4 === 0 ? 2 : 0));
    k++;
  }));

  // trees scattered in the outer blocks and a green belt around the city
  const r = seeded(99);
  const clearOf = (x, z, m) => !obstacles.some(o => Math.abs(x - o.x) < o.hw + m && Math.abs(z - o.z) < o.hd + m) && !LINES.some(L => Math.abs(x - L) < 7 || Math.abs(z - L) < 7) && !(x > 43 && x < 78 && z > -37 && z < -3);
  let placed = 0, tries = 0;
  while (placed < 26 && tries < 800) {
    tries++;
    const x = r() * 140 - 70, z = r() * 140 - 70;
    if (Math.abs(x) < 36 && Math.abs(z) < 36) continue;
    if (clearOf(x, z, 3)) { tree(x, z, 0.85 + r() * 0.4, r() < 0.3 ? 2 : (r() < 0.25 ? 1 : 0)); placed++; }
  }
  for (let i = 0; i < 70; i++) {
    const a = r() * TAU, d = 82 + r() * 26;
    const x = Math.cos(a) * d, z = Math.sin(a) * d;
    if (LINES.some(L => Math.abs(x - L) < 5 || Math.abs(z - L) < 5)) continue;
    tree(x, z, 1 + r() * 0.6, r() < 0.45 ? 2 : 0);
  }
  // trees along inner blocks
  [[8, -32], [32, -32], [8, 32], [32, 32], [-32, 32], [-8, 8.5], [32, 8.5]].forEach(([x, z], i) => tree(x, z, 0.9, i % 2));
  // parked cars anyone can drive
  const P = Math.PI;
  spawnCar({ type: 'clasico', color: '#FF6FAE', accent: '#FFFFFF', deco: 'corazones', extras: ['pestanas', 'sonrisa'] }, 2.1, 22, 0);
  spawnCar({ type: 'jeep', color: '#4FB6F5', accent: '#FFD23F', rims: 'deportiva' }, -2.1, -24, P);
  spawnCar({ type: 'descapotable', color: '#FFD23F', accent: '#FF6FAE', deco: 'rayas' }, 28, -2.1, P / 2);
  spawnCar({ type: 'camioneta', color: '#34CFA0', accent: '#FFFFFF', horn: 'tren' }, -52, 2.1, -P / 2);

function syncCar(c) {

// distance from a point to the car's footprint (0 when touching)
function carDist(c, x, z) {
  const dx = x - c.x, dz = z - c.z, s = Math.sin(c.heading), co = Math.cos(c.heading);
  return Math.hypot(Math.max(0, Math.abs(dx * co - dz * s) - c.hw), Math.max(0, Math.abs(dx * s + dz * co) - c.hl));
}
function carFitsAt(hw, hl, x, z, heading, skip) {
  if (Math.abs(x) > 72 || Math.abs(z) > 72) return false;
  const fx = Math.sin(heading), fz = Math.cos(heading), offs = hl > hw ? [-(hl - hw), 0, hl - hw] : [0];
  for (const s of offs) {
    const ox = x + fx * s, oz = z + fz * s;

    if (Math.hypot(_cp.x - ox, _cp.z - oz) > 0.01) return false;
    if (Math.hypot(player.pos.x - ox, player.pos.z - oz) < hw + 0.7) return false;
  }
  return true;
}

function collide(p, r, skip) {
  for (const o of obstacles) {
    if (o === skip) continue;
    if (Math.abs(p.x - o.x) > o.hw + r || Math.abs(p.z - o.z) > o.hd + r) continue;
    const cx = clamp(p.x, o.x - o.hw, o.x + o.hw), cz = clamp(p.z, o.z - o.hd, o.z + o.hd);
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x += dx / d * (r - d); p.z += dz / d * (r - d); }
    else {
      const px = o.hw - Math.abs(p.x - o.x), pz = o.hd - Math.abs(p.z - o.z);
      if (px < pz) p.x += Math.sign(p.x - o.x || 1) * (px + r); else p.z += Math.sign(p.z - o.z || 1) * (pz + r);
    }
  }
}

function addPet(kind, color, name, pos) {
  const obj = buildPet(kind, color);
  setPetName(obj, name);
  scene.add(obj.root);
  const p = { kind, color, name, obj, pos: (pos || player.pos).clone(), facing: player.facing };
  if (!pos) { p.pos.x -= Math.sin(player.facing) * (1.6 + player.pets.length * 1.3); p.pos.z -= Math.cos(player.facing) * (1.6 + player.pets.length * 1.3); }
  player.pets.push(p);
  return p;
}

const PLAYER_SPEED = 4.8;
function updatePlayer(dt) {
  if (mode === 'drive') { updateCar(dt); return; }
  const ch = player.ch;
  let jx = 0, jy = 0;
  if (mode === 'play') {
    jx = input.jx; jy = input.jy;
    const k = input.keys;
    const kx = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
    const ky = (k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0);
    if (kx || ky) { const l = Math.hypot(kx, ky); jx = kx / l; jy = ky / l; }
  }
  let mag = Math.hypot(jx, jy);
  if (mag < 0.14) { jx = jy = 0; mag = 0; } else if (mag > 1) { jx /= mag; jy /= mag; }
  // moverse deja lo que estaba haciendo (sentada, bailando, saludando…)
  if (mag > 0 && ch.sp && ch.sp.stopOnMove) { avatarStop(ch); standUp(); }
  if (player.seat) { jx = jy = 0; mag = 0; }
  const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw), rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
  const dx = rx * jx - fx * jy, dz = rz * jx - fz * jy;
  const acc = 1 - Math.exp(-dt * (mag > 0 ? 10 : 12));
  player.vel.x += (dx * PLAYER_SPEED - player.vel.x) * acc;
  player.vel.z += (dz * PLAYER_SPEED - player.vel.z) * acc;
  if (!player.seat) {
    player.pos.x += player.vel.x * dt; player.pos.z += player.vel.z * dt;
    collide(player.pos, 0.5);
    for (const n of npcs) { // gently step around neighbours
      const ex = player.pos.x - n.pos.x, ez = player.pos.z - n.pos.z, d = Math.hypot(ex, ez);
      if (d < 0.9 && d > 1e-4) { player.pos.x += ex / d * (0.9 - d); player.pos.z += ez / d * (0.9 - d); }
    }
    player.pos.x = clamp(player.pos.x, -73, 73); player.pos.z = clamp(player.pos.z, -73, 73);
  }
  const sp = player.seat ? 0 : Math.hypot(player.vel.x, player.vel.z);
  if (sp > 0.4 && mode === 'play') player.facing = lerpAngle(player.facing, Math.atan2(player.vel.x, player.vel.z), 1 - Math.exp(-dt * 12));
  if (input.jump && !player.air && !player.seat && mode === 'play') {
    player.vy = 8.2; player.air = true; sfx('jump');
    avatarDo(ch, 'jump', { start: 0.36, ts: 0.75, stopOnMove: false });
  }
  input.jump = false;
  if (ch.sp && ch.sp.name === 'walk_back' && !player.seat) {   // retrocede a la velocidad de la animación
    const v = 0.32 * ch.k; player.pos.x -= Math.sin(player.facing) * v * dt; player.pos.z -= Math.cos(player.facing) * v * dt;
    collide(player.pos, 0.5); player.pos.x = clamp(player.pos.x, -73, 73); player.pos.z = clamp(player.pos.z, -73, 73);
  }

const _look = new THREE.Vector3(), _pos = new THREE.Vector3();
function cameraBlock(look, yaw, pitch, dist) {
  // shorten the boom if a building stands between the player and the camera
  let best = dist;
  const cp = Math.cos(pitch);
  for (let i = 1; i <= 14; i++) {
    const f = i / 14 * dist;
    const x = look.x + Math.sin(yaw) * cp * f, z = look.z + Math.cos(yaw) * cp * f, y = look.y + Math.sin(pitch) * f;
    for (const o of obstacles) {

      if (Math.abs(x - o.x) < o.hw + 0.4 && Math.abs(z - o.z) < o.hd + 0.4) { best = Math.max(3, f * 0.85); return best; }
    }

}
function panelIsSheet() { return window.innerWidth <= 760 || (window.innerHeight > window.innerWidth && window.innerWidth <= 1000); }
function updateCamera(dt) {
  const p = player.pos;

  if (mode === 'drive') {
    const c = driving;
    if (!pointers.size) cam.yaw = lerpAngle(cam.yaw, c.heading + Math.PI, 1 - Math.exp(-dt * (Math.abs(c.speed) > 1 ? 2.6 : 0.8)));
    _look.set(c.x, c.model.camY, c.z);
    const dist = cameraBlock(_look, cam.yaw, cam.pitch, cam.dist + Math.abs(c.speed) * 0.12);
    const cp = Math.cos(cam.pitch) * dist;
    _pos.set(_look.x + Math.sin(cam.yaw) * cp, _look.y + Math.sin(cam.pitch) * dist, _look.z + Math.cos(cam.yaw) * cp);
    k = 1 - Math.exp(-dt * 8);
  } else if (mode === 'play' || mode === 'intro') {
    if (mode === 'intro') cam.yaw += dt * 0.12;
    _look.set(p.x, 1.6 + player.y * 0.5, p.z);
    const dist = cameraBlock(_look, cam.yaw, cam.pitch, cam.dist);
    const cp = Math.cos(cam.pitch) * dist;
    _pos.set(_look.x + Math.sin(cam.yaw) * cp, _look.y + Math.sin(cam.pitch) * dist, _look.z + Math.cos(cam.yaw) * cp);
    k = 1 - Math.exp(-dt * 9);
  } else if (mode === 'shop') {
    const sheet = panelIsSheet(), yaw = 0.35;
    const size = ttModel ? Math.max(ttModel.hl, ttModel.hw * 1.25) : 3;
    let d = 6.5 + size * 1.7; if (camera.aspect < 1) d *= 1.35;
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    _look.set(TT.x, 1.0 + (ttModel ? ttModel.camY * 0.3 : 0.6), TT.z);
    _pos.set(_look.x + Math.sin(yaw) * d, _look.y + d * 0.3, _look.z + Math.cos(yaw) * d);
    const vt = Math.tan(camera.fov * Math.PI / 360), ht = vt * camera.aspect;
    if (sheet) _look.y -= 0.55 * d * vt;
    else { _look.x += rx * 0.44 * d * ht; _look.z += rz * 0.44 * d * ht; }
    k = 1 - Math.exp(-dt * 4);
  } else {
    const sheet = panelIsSheet(), yaw = cam.menuYaw;
    let d = 5.6;
    if (camera.aspect < 1) d *= 1.25;
    const fwx = Math.sin(yaw), fwz = Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    _look.set(p.x, 0.95, p.z);
    if (mode === 'pets' && preview) { _look.x = (p.x + preview.root.position.x) / 2; _look.z = (p.z + preview.root.position.z) / 2; }
    _pos.set(_look.x + fwx * d, _look.y + 0.5, _look.z + fwz * d);
    const vt = Math.tan(camera.fov * Math.PI / 360), ht = vt * camera.aspect;
    if (sheet) _look.y -= 0.5 * d * vt;
    else { _look.x += rx * 0.44 * d * ht; _look.z += rz * 0.44 * d * ht; }
    k = 1 - Math.exp(-dt * 5);
  }
  cam.pos.lerp(_pos, k); cam.look.lerp(_look, k);

  fill.position.set(cam.pos.x, cam.pos.y + 3, cam.pos.z); fill.target.position.copy(cam.look);
  fill.intensity = lerp(fill.intensity, mode === 'pets' || mode === 'shop' ? 0.7 : 0.3, k);
  sun.position.set(p.x + SUN_OFF.x, SUN_OFF.y, p.z + SUN_OFF.z);

}

/* ================= DRIVING ================= */
let driving = null;
const DRIVE = { rev: 5.5, brake: 22, drag: 3.2 };
const _cp = new THREE.Vector3();

function nearestCar(r) {
  let best = null, bd = r;
  for (const c of cars) { const d = carDist(c, player.pos.x, player.pos.z); if (d < bd) { bd = d; best = c; } }
  return best;
}
// put the character on the driver's seat, sitting down (pose final de "sit": caderas a 0,158 m, 0,10 m atrás)
function seatPlayer(c) {
  // el auto está achicado (M.k): Nina va dentro de su grupo, así que se compensa la escala
  const M = c.model, k = player.ch.k, ik = 1 / M.k;
  player.ch.root.scale.setScalar(ik);
  player.ch.root.position.set(M.seat.x, M.sy + (0.16 - 0.158 * k) * ik, M.seat.z + 0.1 * k * ik);

}
// brazos al volante (encima de la pose sentada)
const _qa = new THREE.Quaternion(), _ea = new THREE.Euler();
function steerArms(ch, steer) {
  const b = ch.bones || (ch.bones = {});
  ['UpperArmL', 'UpperArmR', 'ForearmL', 'ForearmR'].forEach(n => { if (!b[n]) b[n] = ch.model.getObjectByName(n); });
  [['L', 1], ['R', -1]].forEach(([sd, s]) => {
    b['UpperArm' + sd].quaternion.slerp(_qa.setFromEuler(_ea.set(-1.05 + s * steer * 0.18, 0, 0)), 1);
    b['Forearm' + sd].quaternion.setFromEuler(_ea.set(-0.55, 0, 0));

}
function enterCar(c) {

  player.vel.set(0, 0, 0); player.air = false; player.y = 0;
  c.speed = 0; c.steer = 0;
  standUp(); setHolding(player.ch, player.ch.holding);
  c.shell.add(player.ch.root); seatPlayer(c);
  avatarDo(player.ch, 'sit', { start: 9, instant: true, stopOnMove: false });
  // the first pet hops into the passenger seat
  const M = c.model;
  if (M.passenger && player.pets.length) {
    const p = player.pets[0]; p.riding = c; c.shell.add(p.obj.root);
    p.obj.root.position.set(M.passenger.x, M.sy, M.passenger.z); p.obj.root.rotation.set(0, 0, 0); p.obj.root.scale.setScalar(1 / M.k);
  }
  if (c.owned) lastCar = c;
  gameEl.classList.add('driving'); setActionButton(null); currentZone = null;
  input.brake = false;
  cam.dist = Math.max(cam.dist, 10 + c.hl * 1.3);
  sfx('open'); startEngine();
  joyHint.textContent = '¡Maneja aquí!'; joyHint.hidden = false;
  setTimeout(() => { joyHint.hidden = true; }, 3500);
}
function spotIsFree(x, z) {
  _cp.set(x, 0, z); collide(_cp, 0.55);
  return Math.hypot(_cp.x - x, _cp.z - z) < 0.05 && Math.abs(x) < 73 && Math.abs(z) < 73;
}
function exitCar() {
  const c = driving; if (!c) return;
  const fx = Math.sin(c.heading), fz = Math.cos(c.heading), lx = Math.cos(c.heading), lz = -Math.sin(c.heading);
  const a = c.hw + 0.9, b = c.hl + 1.0;
  const tries = [[lx * a, lz * a], [-lx * a, -lz * a], [-fx * b, -fz * b], [fx * b, fz * b], [lx * (a + 1.2), lz * (a + 1.2)], [-lx * (a + 1.2), -lz * (a + 1.2)]];
  const spot = tries.find(([dx, dz]) => spotIsFree(c.x + dx, c.z + dz)) || tries[0];
  scene.add(player.ch.root); player.ch.root.scale.setScalar(1);
  player.pos.set(c.x + spot[0], 0, c.z + spot[1]); collide(player.pos, 0.5);
  player.ch.root.position.copy(player.pos); player.ch.root.rotation.set(0, c.heading, 0);
  player.facing = c.heading; player.happy = 0.8;

  player.pets.forEach(p => {
    if (!p.riding) return;
    p.riding = null; scene.add(p.obj.root); p.obj.root.scale.setScalar(1);
    p.pos.set(player.pos.x - fx * 1.3, 0, player.pos.z - fz * 1.3); p.facing = c.heading;
  });

  const M = c.model;
  if (M.steerWheel) M.steerWheel.rotation.z = 0;

}

function updateCar(dt) {
  const c = driving, S = c.stats, M = c.model;
  let jx = input.jx, jy = input.jy;
  const k = input.keys;
  const kx = (k.KeyD || k.ArrowRight ? 1 : 0) - (k.KeyA || k.ArrowLeft ? 1 : 0);
  const ky = (k.KeyS || k.ArrowDown ? 1 : 0) - (k.KeyW || k.ArrowUp ? 1 : 0);
  if (kx || ky) { jx = kx; jy = ky; }
  let mag = Math.min(1, Math.hypot(jx, jy));
  if (mag < 0.14) { jx = jy = 0; mag = 0; }
  const brake = input.brake || k.Space;
  // pushing up or sideways drives forward; pulling down brakes, then backs up
  const back = jy > 0.45 && Math.abs(jx) < 0.7;
  if (brake || back) {
    if (c.speed > 0.4) c.speed -= DRIVE.brake * dt;
    else c.speed = Math.max(-DRIVE.rev, c.speed - 6 * dt);
  } else if (mag > 0) {
    c.speed += (c.speed < 0 ? DRIVE.brake : S.acc * (c.speed > S.max * 0.66 ? 0.6 : 1)) * mag * dt;
  } else c.speed -= Math.sign(c.speed) * Math.min(Math.abs(c.speed), DRIVE.drag * dt);

  c.steer = lerp(c.steer, jx, 1 - Math.exp(-dt * 7));
  const grip = clamp(Math.abs(c.speed) / 4, 0, 1) * (c.speed >= 0 ? 1 : -1);
  c.heading -= c.steer * S.turn * grip * dt;

  c.x += Math.sin(c.heading) * c.speed * dt;
  c.z += Math.cos(c.heading) * c.speed * dt;
  // bump into houses, trees, other cars and neighbours (circles along the car)
  let px = 0, pz = 0;
  const fx = Math.sin(c.heading), fz = Math.cos(c.heading);
  for (const s of c.offs) {
    const ox = c.x + fx * s, oz = c.z + fz * s;
    _cp.set(ox, 0, oz); collide(_cp, c.cr, c.obs);
    px += _cp.x - ox; pz += _cp.z - oz;
  }
  for (const n of npcs) for (const s of c.offs) {
    const ox = c.x + fx * s, oz = c.z + fz * s, dx = ox - n.pos.x, dz = oz - n.pos.z, d = Math.hypot(dx, dz), R = c.cr + 0.45;
    if (d < R && d > 1e-4) { px += dx / d * (R - d); pz += dz / d * (R - d); }
  }
  const push = Math.hypot(px, pz);
  if (push > 0.001) {
    c.x += px; c.z += pz;
    if (Math.abs(c.speed) > 3 && c.bump <= 0) { sfx('bonk'); c.bump = 0.4; player.bonk = 0.9; c.shell.position.y = 0.12 + 0.05 * S.bounce; }
    c.speed *= Math.abs(c.speed) > 3 ? 0.35 : 0.8;
  }
  c.bump -= dt;
  c.x = clamp(c.x, -73, 73); c.z = clamp(c.z, -73, 73);
  syncCar(c);

  // body roll and bounce, spinning wheels, steering wheel
  const sp01 = c.speed / S.max, e6 = 1 - Math.exp(-dt * 6);
  c.shell.rotation.z = lerp(c.shell.rotation.z, c.steer * 0.08 * clamp(sp01 * 2, -1, 1), e6);
  c.shell.rotation.x = lerp(c.shell.rotation.x, -(brake ? 0.04 : 0) * Math.sign(c.speed) + Math.sin(clock * 7) * 0.012 * (S.bounce - 1) * Math.abs(sp01), e6);
  c.shell.position.y = lerp(c.shell.position.y, Math.abs(Math.sin(clock * 18)) * 0.02 * S.bounce * Math.abs(sp01), 1 - Math.exp(-dt * 10));
  c.wheels.forEach(w => { w.spin.rotation.x += c.speed * dt / w.r; if (w.front) w.pivot.rotation.y = -c.steer * 0.45; });
  if (M.steerWheel) M.steerWheel.rotation.z = c.steer * 1.4;
  if (M.antenna) M.antenna.rotation.x = lerp(M.antenna.rotation.x, -clamp(sp01, -1, 1) * 0.5 + Math.sin(clock * 11) * 0.1 * Math.abs(sp01), 1 - Math.exp(-dt * 8));
  if (M.sirens) { const on = Math.sin(clock * 12) > 0; M.sirens[0].emissiveIntensity = on ? 1.3 : 0.15; M.sirens[1].emissiveIntensity = on ? 0.15 : 1.3; }

  player.pos.set(c.x, 0, c.z); player.facing = c.heading;
  seatPlayer(c);
  player.bonk = Math.max(0, player.bonk - dt); player.happy = Math.max(0, player.happy - dt);
  updateAvatar(player.ch, dt, 0, player.bonk > 0 ? 'sorpresa' : (Math.abs(sp01) > 0.7 ? 'feliz' : null));
  steerArms(player.ch, c.steer);
  for (const p of player.pets) if (p.riding) animatePet(p.obj, clock, 0, dt);
  setEngine(Math.abs(c.speed));
}

// bring your own car next to you
function callCar() {
  if (mode !== 'play') return;
  const c = lastCar && ownedCars.includes(lastCar) ? lastCar : ownedCars[ownedCars.length - 1];
  if (!c) { toast('Todavía no tienes auto. ¡Ve a Autos Arcoíris a diseñar uno! 🚗'); return; }
  const f = Math.round(player.facing / (Math.PI / 2)) * (Math.PI / 2);
  const fx = Math.sin(f), fz = Math.cos(f), lx = Math.cos(f), lz = -Math.sin(f);

  [c.hw + 1.2, c.hw + 2.6, c.hw + 4.2].forEach(a => tries.push([lx * a, lz * a], [-lx * a, -lz * a]));
  [c.hl + 1.4, c.hl + 3.2].forEach(b => tries.push([fx * b, fz * b], [-fx * b, -fz * b]));
  for (const [dx, dz] of tries) {
    const x = player.pos.x + dx, z = player.pos.z + dz;
    if (carFitsAt(c.hw, c.hl, x, z, f, c.obs)) {

let AC = null, master, musicGain, sfxGain, noiseBuf, musicOn = true, seqTimer = null, nextTime = 0, step = 0;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
  AC = new Ctx();
  master = AC.createGain(); master.gain.value = 0.9; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = 0.2; musicGain.connect(master);
  sfxGain = AC.createGain(); sfxGain.gain.value = 0.32; sfxGain.connect(master);

function tone(freq, t, dur, type, gain, dest, attack = 0.008, freqEnd) {

// I – V – vi – IV in C major, two melodic phrases
const CHORDS = [[48, 64, 67, 72], [43, 62, 67, 71], [45, 64, 69, 72], [41, 65, 69, 72]];
const MELODY = [
  [76, 79, 84, 79, 76, 0, 74, 76], [74, 79, 83, 79, 74, 0, 71, 74], [72, 76, 81, 76, 72, 76, 79, 81], [81, 79, 77, 76, 74, 0, 72, 0],
  [79, 0, 76, 79, 84, 0, 83, 81], [79, 0, 74, 79, 83, 0, 81, 79], [76, 0, 81, 0, 84, 83, 81, 76], [77, 81, 84, 81, 79, 77, 76, 74]

const STEP = 60 / 118 / 2;
function playStep(s, t) {
  const bar = Math.floor(s / 8) % 8, st = s % 8, ch = CHORDS[bar % 4], m = MELODY[bar][st];
  if (m) { tone(mtof(m), t, 0.3, 'triangle', 0.42, musicGain); tone(mtof(m + 12), t, 0.16, 'sine', 0.08, musicGain); }
  if (st === 0 || st === 4) { tone(mtof(ch[0]), t, 0.42, 'sine', 0.75, musicGain, 0.01); tone(150, t, 0.14, 'sine', 0.45, musicGain, 0.004, 48); }
  if (st === 3 || st === 7) tone(mtof(ch[0] + 7), t, 0.2, 'sine', 0.35, musicGain);
  if (st === 2 || st === 6) for (let i = 1; i < 4; i++) tone(mtof(ch[i] - 12), t + i * 0.012, 0.24, 'sine', 0.12, musicGain);

function toneF(freq, t, dur, type, gain, fType, fFreq, freqEnd, attack = 0.01) {
  const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();

  const wh = (x, y, r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#2B2F45"/><circle cx="${x}" cy="${y}" r="${(r * 0.42).toFixed(1)}" fill="#E6E9F2"/>`;

    clasico: `<path d="M14 12 L17 4 H38 L42 12Z" fill="${c}" ${o}/><path d="M18.5 11 L20.5 6 H27 V11Z M30 11 V6 H36 L38.5 11Z" fill="${gl}"/><rect x="15" y="2" width="25" height="3" rx="1.5" fill="${a}" ${o}/><rect x="4" y="11" width="48" height="11" rx="5" fill="${c}" ${o}/>` + wh(15, 22, 5) + wh(41, 22, 5),
    descapotable: `<rect x="20" y="5" width="5" height="8" rx="2" fill="${a}" ${o}/><path d="M31 12 L34 5.5" stroke="#9AA3B8" stroke-width="2.4" stroke-linecap="round"/><path d="M3 19 V15 Q3 12 8 12 H46 Q53 12 53 16 V19Z" fill="${c}" ${o}/>` + wh(13, 20, 5) + wh(43, 20, 5),
    jeep: `<circle cx="4.5" cy="13" r="4" fill="#2B2F45"/><path d="M16 8 V2 H23 V8" fill="none" stroke="${a}" stroke-width="2.4" stroke-linejoin="round"/><path d="M35 8 V3" stroke="#3C4670" stroke-width="2.4" stroke-linecap="round"/><rect x="6" y="8" width="44" height="12" rx="2" fill="${c}" ${o}/>` + wh(16, 21, 6) + wh(40, 21, 6),
    buggy: `<path d="M17 14 L20 3 H31 L38 14" fill="none" stroke="${a}" stroke-width="2.4" stroke-linejoin="round"/><path d="M11 13 H40 L51 16 Q52 19 49 20 H11Z" fill="${c}" ${o}/>` + wh(15, 20, 7) + wh(45, 22, 5),
    deportivo: `<path d="M2 7 H10 M6 7 V12" stroke="${a}" stroke-width="2.4" stroke-linecap="round"/><path d="M3 20 V14 Q4 11 12 11 L22 7 H30 L38 11 Q50 12 53 16 V20Z" fill="${c}" ${o}/><path d="M24 8.5 H29 L34 11 H22Z" fill="${gl}"/>` + wh(13, 20, 5) + wh(43, 20, 5),
    camioneta: `<path d="M27 11 V3 H38 Q41 3 43 7 L45 11Z" fill="${c}" ${o}/><path d="M30 10 V5 H37 L39.5 10Z" fill="${gl}"/><rect x="3" y="10" width="51" height="10" rx="3" fill="${c}" ${o}/><path d="M6 13.5 H24" stroke="rgba(38,49,92,.3)" stroke-width="1.5"/>` + wh(12, 21, 5.5) + wh(44, 21, 5.5),
    monster: `<path d="M19 4 V1 H25 V4" fill="none" stroke="${a}" stroke-width="2" stroke-linejoin="round"/><path d="M11 12 V6 Q11 4 14 4 H38 Q44 4 45 8 L46 12Z" fill="${c}" ${o}/>` + wh(15, 19.5, 7.5) + wh(41, 19.5, 7.5),
    karting: `<rect x="15" y="9" width="4.5" height="8" rx="1.5" fill="${a}" ${o}/><path d="M30 16 L33 10" stroke="#3C4670" stroke-width="2" stroke-linecap="round"/><path d="M5 20 L9 16 H47 L51 20Z" fill="${c}" ${o}/>` + wh(12, 22, 4.5) + wh(44, 22, 4.5)
  };
  return svgI(56, 28, P[type]);
}
const stars = n => '★'.repeat(n) + '☆'.repeat(5 - n);
function refreshTT() {
  if (ttModel) { ttGroup.remove(ttModel.g); ttModel.dispose(); }
  ttModel = buildCarModel(shopSpec); ttModel.g.position.y = 0.1; ttGroup.add(ttModel.g);
}
function updateBuyBtn() { btnBuy.innerHTML = shopEditing ? '<span class="em">💾</span>Guardar cambios' : '<span class="em">🔑</span>¡Lo quiero!'; }
function renderShopTabs() { shopTabsEl.innerHTML = SHOP_TABS.map(t => `<button class="tab${t.id === shopTab ? ' on' : ''}" data-tab="${t.id}">${t.label}</button>`).join(''); }
function renderShop() {
  const s = shopSpec, T = CAR_TYPE[s.type];
  let h = shopEditing && shopTab !== 'garaje' ? `<p class="note editing">Estás cambiando tu <b>${esc(T.name.toLowerCase())}</b>. Toca <b>Guardar cambios</b> cuando termines.</p>` : '';
  if (shopTab === 'modelo') {
    h += '<h3>Tipo de auto</h3>' + optsHTML(CAR_TYPES.map(t => ({ id: t.id, name: t.name, ic: carIcon(t.id, s.color, s.accent) })), s.type, 'type') +
      `<p class="note"><b>${T.name}:</b> ${T.desc}<br>Rapidez ${stars(T.vel)} &nbsp; Giro ${stars(T.giro)}</p>`;
  } else if (shopTab === 'pintura') {
    h += '<h3>Color del auto</h3>' + swHTML(CAR_COLORS, s.color, 'color') + '<h3>Color de detalles</h3>' + swHTML(CAR_COLORS, s.accent, 'accent') +
      '<p class="note">Los detalles son los asientos, los dibujos y los adornos.</p>';
  } else if (shopTab === 'diseno') {
    h += '<h3>Dibujo a los lados</h3>' + optsHTML(DECALS, s.deco, 'deco');
    if (s.deco === 'numero') h += '<h3>Número</h3><div class="opts nums">' + Array.from({ length: 12 }, (_, i) => i + 1).map(n => `<button class="opt${n === s.num ? ' on' : ''}" data-k="num" data-v="${n}">${n}</button>`).join('') + '</div>';
  } else if (shopTab === 'ruedas') {
    h += '<h3>Llantas</h3>' + optsHTML(RIMS, s.rims, 'rims');
  } else if (shopTab === 'adornos') {
    h += '<h3>En el techo</h3>' + optsHTML(TOPPERS, s.topper, 'topper') + '<h3>Extras</h3><div class="opts">' +
      EXTRAS.map(x => `<button class="opt${s.extras.includes(x.id) ? ' on' : ''}" data-k="extra" data-v="${x.id}"><span class="ic">${x.ic}</span><span>${x.name}</span></button>`).join('') +
      '</div><p class="note">Puedes elegir varios extras a la vez.</p>';
  } else if (shopTab === 'bocina') {
    h += '<h3>Sonido de la bocina</h3>' + optsHTML(HORNS, s.horn, 'horn') + '<p class="note">Toca una para escucharla.</p>';
  } else {
    const list = ownedCars.length
      ? '<div class="mypets garage">' + ownedCars.map((c, i) => `<div class="mypet${c === shopEditing ? ' on' : ''}"><span class="cdot" style="background:${c.spec.color}"></span><b>${esc(CAR_TYPE[c.spec.type].name)}</b><button class="toy" data-g="edit" data-i="${i}">Cambiar</button><button class="toy" data-g="rm" data-i="${i}">Devolver</button></div>`).join('') + '</div>'
      : '<p class="empty">Todavía no tienes autos. Diseña uno y toca "¡Lo quiero!".</p>';
    h += (shopEditing ? '<button class="toy mint wide" data-g="new"><span class="em">➕</span>Diseñar un auto nuevo</button>' : '') +
      `<h3>Mis autos (${ownedCars.length}/${MAX_CARS})</h3>` + list +
      '<p class="note">Con el botón 🚗 Mi auto puedes llamar a tu auto desde cualquier parte de la ciudad.</p>';
  }
  shopBody.innerHTML = h;
}
shopTabsEl.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; shopTab = b.dataset.tab; renderShopTabs(); renderShop(); shopBody.scrollTop = 0; sfx('pop'); });
shopBody.addEventListener('click', e => {
  const g = e.target.closest('[data-g]');
  if (g) {
    const act = g.dataset.g, c = ownedCars[+g.dataset.i];
    if (act === 'new') { shopEditing = null; shopSpec = fixCarSpec(DEFAULT_CAR); shopTab = 'modelo'; }
    else if (act === 'edit' && c) { shopEditing = c; shopSpec = clone(c.spec); shopTab = 'modelo'; ttSpin = 0.5; }
    else if (act === 'rm' && c) {
      removeCar(c); ownedCars.splice(ownedCars.indexOf(c), 1);
      if (shopEditing === c) shopEditing = null;
      if (lastCar === c) lastCar = null;
      toast('Tu auto volvió a la tienda'); save();
    }
    sfx('pop'); refreshTT(); updateBuyBtn(); renderShopTabs(); renderShop(); return;
  }
  const b = e.target.closest('[data-k]'); if (!b) return;
  const k = b.dataset.k, v = b.dataset.v, s = shopSpec;
  if (k === 'extra') { const i = s.extras.indexOf(v); if (i >= 0) s.extras.splice(i, 1); else s.extras.push(v); }
  else if (k === 'num') s.num = +v;
  else s[k] = v;
  if (k === 'horn') { initAudio(); hornSound(v); renderShop(); return; }
  sfx('pop'); refreshTT(); renderShop();
});
$('#btnCarRandom').addEventListener('click', () => { shopSpec = randomCarSpec(); ttSpin = 0.5; sfx('pop'); refreshTT(); renderShop(); });
btnBuy.addEventListener('click', () => {
  if (shopEditing) {
    setCarModel(shopEditing, buildCarModel(clone(shopSpec))); syncCar(shopEditing);
    save(); sfx('adopt'); toast('¡Tu auto quedó como nuevo!'); return;
  }
  if (ownedCars.length >= MAX_CARS) {
    toast('Ya tienes 4 autos. Devuelve uno en "Mi garaje" para llevarte otro.');
    shopTab = 'garaje'; renderShopTabs(); renderShop(); return;
  }
  const spec = clone(shopSpec), M = buildCarModel(spec);
  const spot = SPAWNS.find(([x, z, h]) => carFitsAt(M.hw, M.hl, x, z, h));
  if (!spot) { M.dispose(); toast('La calle está llena de autos. Intenta en un ratito.'); return; }
  const c = spawnCar(spec, spot[0], spot[1], spot[2], true, M);
  ownedCars.push(c); lastCar = c;
  closeShop();
  enterCar(c);
  save(); sfx('adopt');
  toast('¡Tu auto nuevo! Maneja con el círculo 🚗');
});
function openShop() {
  if (mode !== 'play') return;
  player.pos.set(TT.x - 5.3, 0, TT.z + 1.6); collide(player.pos, 0.5);
  player.facing = Math.atan2(TT.x - player.pos.x, TT.z - player.pos.z);
  enterMenu('shop'); shopPanel.hidden = false;
  shopEditing = null; shopTab = 'modelo'; ttSpin = 0.5; ttDrag = 0;
  refreshTT(); updateBuyBtn(); renderShopTabs(); renderShop(); shopBody.scrollTop = 0;
}
function closeShop() {
  if (shopEditing) { shopEditing = null; shopSpec = fixCarSpec(DEFAULT_CAR); refreshTT(); }
  shopPanel.hidden = true; leaveMenu(); save();
}
$('#shopDone').addEventListener('click', closeShop);

/* ================= LOOP & BOOT ================= */
let last = performance.now(), placeT = 0;
const placeName = $('#placeName');
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; clock += dt;
  updatePlayer(dt);
  if (mode === 'drive') followChain(player.pets.filter(p => !p.riding), player.pos, dt, clock, driving.hl + 1.3);
  else followChain(player.pets, player.pos, dt, clock, 1.7);
  updateNPCs(dt, clock);
  updatePreview(dt, clock);
  updateZones();
  for (const f of animated) f(clock, dt);
  updateCamera(dt);
  sky.position.copy(camera.position);
  cullAvatars();
  placeT -= dt; if (placeT <= 0) { placeT = 0.3; placeName.textContent = areaName(player.pos.x, player.pos.z); }
  renderer.render(scene, camera);
}
function resize() {
  const w = gameEl.clientWidth || window.innerWidth, h = gameEl.clientHeight || window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 1 ? 64 : 52; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend(); else AC.resume(); });

let sky;
async function boot() {
  try { await Promise.race([document.fonts ? document.fonts.load('800 40px "Baloo 2"') : null, new Promise(r => setTimeout(r, 1500))]); } catch (e) { }
  sky = buildSky(); buildClouds(); buildCity();
  const saved = loadSave();
  await loadNina();
  player.ch = makeAvatar(null);
  const pets = saved ? (saved.pets || []) : [{ kind: 'perro', color: '#E9B77A', name: 'Toby' }];
  pets.slice(0, MAX_PETS).forEach(p => { if (PET_KINDS.some(k => k.id === p.kind)) addPet(p.kind, p.color || '#E9B77A', String(p.name || 'Toby').slice(0, 12)); });
  // your own cars, parked where you left them
  (saved && Array.isArray(saved.cars) ? saved.cars : []).slice(0, MAX_CARS).forEach(o => {
    if (!o) return;
    const spec = fixCarSpec(o.spec), M = buildCarModel(spec);
    let x = +o.x, z = +o.z, h = +o.h || 0;
    if (!isFinite(x) || !isFinite(z) || !carFitsAt(M.hw, M.hl, x, z, h)) {
      const sp = SPAWNS.find(([a, b, c]) => carFitsAt(M.hw, M.hl, a, b, c));
      if (!sp) { M.dispose(); return; }
      [x, z, h] = sp;
    }
    ownedCars.push(spawnCar(spec, x, z, h, true, M));
  });
  lastCar = ownedCars[ownedCars.length - 1] || null;
  if (saved && saved.shop) shopSpec = fixCarSpec(saved.shop);
  refreshTT();
  spawnNPCs(7);
  resize();
  cam.look.set(player.pos.x, 1.6, player.pos.z); cam.pos.set(player.pos.x + 8, 7, player.pos.z + 8);
  requestAnimationFrame(t => { last = t; frame(t); });
  const play = $('#btnPlay'); play.disabled = false; play.textContent = '¡A jugar!';
  play.addEventListener('click', () => {
    initAudio(); if (musicOn) startMusic();
    $('#start').hidden = true; gameEl.classList.remove('intro'); mode = 'play';
    cam.yaw = player.facing + Math.PI + 0.35; sfx('open');
  });
}
if (typeof THREE === 'undefined') { const b = $('#btnPlay'); b.textContent = 'No se pudo cargar el 3D. Revisa tu conexión.'; }
else boot().catch(err => { console.error(err); const b = $('#btnPlay'); b.textContent = 'Algo falló al construir la ciudad'; });

</script>
